        #num{
            border-radius: 10px;
            border-color: black;
            border-style: solid;
            height: 35px;

            border-radius: 10px;
             border-color: black;

</head>
<body align="center">
    <div class="one">
    <h1> Guess the Number</h1>
    <h2 >From 1 to 10</h2>
    <input id="num" placeholder="Enter your Guessed Number......">
    <button onclick="check()" class="button">Check</button>
    <p id="result"> You are right/ wrong</p>
    <P id="score"> Your Score is :10</P>
    </div>



    <!------------------java------------------->

    <script>
        var num = document.getElementById("num");
        var result= document.getElementById('result');
        var r=Math.floor(Math.random()*10+1);
        var s=document.getElementById("score");
        var totalscore=10

        function check(){

            var number=num.value;
            if(number==r){
                console.log("Right");
                result.textContent="Right";
                alert("YOU WON THE GAME ..........");

            }
            else{
                console.log("Wrong");
                totalscore=totalscore-1;
                score.textContent="Your Score :"+ totalscore;
                result.textContent="Wrong";
                
            }
        }



    </script>
</body>
