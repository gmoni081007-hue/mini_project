<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>

    <style>
        body{
            background-image: url('ree.jpg');
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
        }

        div{
            max-width: 600px;
            padding: 40px;
            border-radius: 20px;
            border: 2px solid black;
            background-color: rgba(133, 130, 139, 0.581);
            text-align: center;
            box-shadow: 0 0 50px;
        }

        h1{
            text-shadow: 0 0 8px;
            margin-bottom: 20px;
        }

        #input{
            width: 430px;
            height: 40px;
            border-radius: 10px;
            background-color: rgba(194, 192, 199, 0.581);
            color: black;
            box-shadow: 0 0 9px;
            font-size: 18px;
            padding-left: 10px;
        }

        #input:hover{
            box-shadow: 0 0 15px;
        }

        .btn{
            height: 39px;
            padding: 9px 14px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 5px;
            background-color: rgba(83, 82, 84, 0.581);
            box-shadow: 0 0 4px;
            cursor: pointer;
        }

        .btn:hover{
            box-shadow: 0 0 10px;
        }

        ul{
            padding: 0;
            margin-top: 20px;
        }

        li{
            list-style: none;
            background-color: rgba(114, 113, 117, 0.581);
            max-width: 400px;
            margin: 10px auto;
            padding: 10px 14px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 2px solid black;
            box-shadow: 0 0 8px;
            font-size: 20px;
        }

        li:hover{
            box-shadow: 0 0 15px;
        }

        li button{
            font-size: 20px;
            font-weight: bold;
            border-radius: 5px;
            background-color: rgba(83, 82, 84, 0.581);
            cursor: pointer;
        }

        li button:hover{
            box-shadow: 0 0 5px;
        }
    </style>
</head>

<body>
    <div>
        <h1>----🩶 To-Do-List 🩶----</h1>

        <input id="input" placeholder="Add the task to do 👇🏻">
        <button class="btn" onclick="add()">Add</button>

        <ul id="list"></ul>
    </div>

    <script>
        var ul = document.getElementById("list");

        function add(){
            var input = document.getElementById("input");

            if(input.value.trim() === ""){
                alert("Please enter a task!");
                return;
            }

            var li = document.createElement("li");
            li.innerHTML = input.value +
                "<button onclick='removeTask(event)'> x </button>";

            ul.append(li);
            input.value = "";
        }

        function removeTask(event){
            event.target.parentElement.remove();
        }
    </script>
</body>
</html>
